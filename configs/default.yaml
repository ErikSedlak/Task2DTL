# Thresholds live here, not in code (CLAUDE.md hard rule 3). Values marked (tune) in DESIGN.md
# are starting points and may only be tuned on splits/dev_train.txt.
data_root: ./data          # overridden by env LSG_DATA
outputs_root: ./outputs
cache_root: ./cache        # refined alignments etc. (git-ignored)

frames:
  stride: 3                # DESIGN §3 (tune)

alignment:                 # T_align refinement, label-free ICP (DECISIONS 2026-11-05/M0)
  refine: true
  frame_step: 10           # every 10th frame builds the source cloud
  voxel: 0.02              # [m] source voxel downsampling
  max_depth: 4.0           # [m] ignore far, noisy depth
  icp_schedule: [0.10, 0.05, 0.03]   # [m] max correspondence distance per stage (= Tukey k)
  max_iter: 50
  max_delta_t: 0.20        # [m] reject corrections larger than this, keep raw T_align
  max_delta_rot_deg: 5.0

visibility:                # DESIGN §3 frame votes (tune on dev only)
  tau_near: 0.10           # [m] |d_obs - d_exp| <= tau_near -> present
  tau_free: 0.15           # [m] d_obs > d_exp + tau_free -> free (seen through)
  min_mask_px: 15          # node needs >= this many first-hit pixels (else unobserved) and
                           # >= this many valid ones (else noinfo) to vote (DECISIONS M3)
  vote_frac: 0.5           # share of valid pixels for a seen / free vote
  erode_px: 0              # erode each node's first-hit mask by this many px (silhouette guard; M3 knob)
  seen_needs_contrast: true  # FULL only (M7, Erik, DECISIONS 2026-11-15): seen only from pixels whose next
                           # reference surface behind (other label) is > tau_free farther; false = M6 FULL (ablation)
  contrast_eps: 0.001      # [m] other-label hits this far in front of the first hit still count (coincident faces)

decorrelation:             # DESIGN §3 viewpoint decorrelation (tune)
  enabled: true            # false = every vote counts (ablation, §8)
  d_dec: 0.30              # [m] camera centre moved this far since the last counted vote ...
  theta_dec_deg: 20.0      # [deg] ... or the optical axis turned this much

states:                    # DESIGN §3 state rules (tune)
  k_free: 2                # counted free votes needed for removed
  k_seen: 3                # counted seen votes (and no counted free / free-like) -> confirmed in place
  k_free_like: 3           # appearance alone (no depth free vote) needs this many counted free-like votes (§3, M6)
  commitment: deferred     # deferred (§3) | immediate (ablation, M7): `removed` final at the first frame with a
                           # tentative removed state (B2 / FULL), even if the node is matched or seen later

online:                    # DESIGN §6.7 online loop
  snapshot_every: 20       # write a tentative snapshot every N processed frames (if enabled)

m0:
  pairs_file: splits/dev_train.txt
  depth_frame_step: 10     # check (1): every 10th frame of each dev rescan
  overlay_scans:           # check (4): rescans used for overlay PNGs
    - 0ad2d3a1-79e2-2212-9b99-a96495d9f7fe
    - 19eda6f4-55aa-29a0-8893-8eac3a4d8193
  overlay_frames: 3
  accept_depth_median: 0.03      # (1) median |d_obs - d_render| [m]
  accept_struct_median: 0.05     # (2) median structure point-to-surface distance [m]
  accept_rigid_chamfer: 0.05     # (3) Chamfer [m]
  accept_rigid_min_objects: 2    # (3) objects below the Chamfer threshold

splits:
  texture_sources:         # pair lists whose references need textures (DESIGN §2.3)
    - splits/dev_train.txt
    - splits/eval_val.txt
    - splits/eval_relchange_train.txt
    - splits/dev_tune.txt
  texture_list: splits/download_textures.txt
  dev_tune:                # tuning set (CHANGE 3 Part 0, Erik 2026-11-20): `lsg splits devtune`, metadata only
    file: splits/dev_tune.txt
    download_list: splits/download_tier3.txt   # scans of dev_tune not yet downloaded (hard rule 6)
    n_heavy: 20            # rooms with the most changes (best rescan per room)
    n_random: 10           # further rooms, seeded, one rescan each
    seed: 0
    weights: {removed: 2.0, new: 1.0, rigid: 0.5}   # room score; removals are rarest (158 of 718 train pairs)
    include: [splits/dev_train.txt]                 # appended; dev_train stays the 3-pair regression set
    exclude_splits: [splits/dev_train.txt, splits/eval_relchange_train.txt]   # rooms never selected
    already_downloaded: [splits/download_tier1.txt, splits/download_tier2.txt]
  milestone_val:           # val subset for per-milestone checks (M6, Erik); full eval_val only for the final tables (M7)
    source: splits/eval_val.txt
    file: splits/eval_val_small.txt   # written by `lsg splits subset`
    n_refs: 20             # references, one rescan each
    seed: 0

relations:                 # geometric support rules, DESIGN §6.3 (tune on dev refs only)
  bottom_slice: 0.03       # [m] child's lowest slice used for contact
  contact_xy: 0.05         # [m] horizontal radius for a supporting point
  contact_dz: 0.10         # [m] supporting point lies 0..contact_dz below the slice point
  contact_min_frac: 0.30   # share of slice points with support -> "on"
  contain_min_frac: 0.60   # share of child points inside an anchor's AABB -> "in"
  floor_max_gap: 0.20      # [m] child bottom this close above floor_z -> parent "floor" (dev-tuned M1; spec start 0.10)
  support_min_height: 0.05 # [m] supporting points must lie this far above floor_z (dev-tuned M1)
  candidate_margin: 0.10   # [m] XY AABB margin for the candidate pre-filter
  next_to_gap: 0.15        # [m] AABB gap for geometric next_to (exported only)
  floor_fallback_percentile: 1.0   # floor_z if no floor-labelled vertices: this percentile of z

eval:                      # evaluation protocol (DESIGN §5, §7) - definitions, not method tunables
  tau_eval_move: 0.10      # [m] GT moves below this are dont_care for moved/unchanged (fixed M1)
  small_max_extent: 0.5    # [m] thing with largest AABB extent below this = "small"
  disp_buckets: [0.1, 0.3, 1.0]    # [m] moved-recall buckets [0.1,0.3), [0.3,1), >=1
  match_new_dist: 0.30     # [m] perception new matching: centroid distance gate (§5)
  match_new_iou: 0.25      # perception new matching: 3D AABB IoU gate (§5)
  bootstrap_n: 1000        # resamples over pairs for 95% CIs (§7.1)
  bootstrap_seed: 0
  workers: 4               # processes for `lsg eval` (one reference group per task)
  save_graphs: true        # write G_upd per pair to outputs/<run>/graphs/

oracle:                    # OracleSource, DESIGN §6.5 (upper bound)
  min_points: 50           # drop instances with fewer observed mesh vertices (tune)
  seed: 0                  # token permutation seed (mixed with the rescan id)
  crops: false             # colour crops (not used by the change logic before M4/M6)
  crop_k: 5

train_meta:                # train-split metadata for vocabulary / priors (DESIGN §2.3)
  exclude_splits: [splits/dev_train.txt, splits/eval_relchange_train.txt, splits/dev_tune.txt]   # their rooms never
                           # count (dev_tune: CHANGE 3, Erik; the M7 list is pinned in ablations.M7_OVERRIDES)

perception:                # PerceptionSource, DESIGN §3 candidate + §6.6 (tune on dev only)
  tau_new: 0.10            # [m] nearer pixel: d_obs < d_exp - tau_new (step 1)
  max_depth: 4.0           # [m] ignore far, noisy depth
  surf_dist: 0.05          # [m] drop residual points this close to the reference mesh (step 2)
  struct_dist: 0.10        # [m] drop points this close to reference structure surfaces (step 2)
  struct_exclude_nyu40: [2, 20]   # floor, floor mat: objects stand on them (handled by surf_dist)
  voxel: 0.04              # [m] voxel size (step 3)
  min_views: 3             # decorrelated viewpoints per kept voxel (step 4; `decorrelation` block); also the thin-object grid, and the depth grid when `relaxed.enabled` is false
  relaxed:                 # CHANGE 1 (docs/CHANGE_candidate_detection.md, Erik 2026-11-19): size-dependent candidate rules
    enabled: true          # false = the M7 method (every cluster needs `min_views` views at `tau_new`); ablation row FULL-relaxed
    min_views_small: 2     # strict tier: voxels hit at `tau_new` need this many decorrelated views (was 3)
    min_views_large: 1     # lenient tier: voxels hit at `tau_new_large` need this many
    tau_new_large: 0.05    # [m] lenient-tier nearer pixel (>= surf_dist: points closer to the reference mesh are dropped anyway)
    large_min_voxels: 40   # a lenient-tier cluster is large (and kept) with at least this many voxels (dev_train: 20 -> 125 candidates, 40 -> 97, same 35 explained by GT)
    link_voxels_large: 1   # lenient-tier connectivity [voxels] (26-connected); with 2, 1-view voxels percolate into room-sized blobs (dev_train: moved-to hits 6/15)
    merge: replace         # replace: a large cluster replaces the strict clusters inside it; add: only where no strict cluster is
    large_min_extent: 0.0  # [m] ... and a longest AABB side of at least this (0 = no extent rule)
  link_voxels: 2          # voxels within this Chebyshev distance [voxels] are connected (1 = 26-conn.)
  min_voxels: 5            # drop clusters with fewer kept voxels (step 5)
  door_filter: true        # drop clusters inside a reference door's swing region (M4, Erik)
  door_frac: 0.5           # share of a cluster's voxels inside a swing region -> dropped
  door_margin: 0.10        # [m] added to the swing radius (door width)
  crop_k: 5                # colour crops per candidate (largest masks)
  crop_margin: 0.10        # crop box enlarged by this share per side
  min_crop_px: 8           # [depth px] smaller masks give no crop
  clip:
    model: ViT-B-32-quickgelu   # openai weights were trained with QuickGELU
    pretrained: openai
    device: cuda           # falls back to CPU if CUDA is unavailable
    prompt: "a photo of a {}"
    vocab_top_n: 100       # most frequent train thing/anchor labels added to the G_ref labels
    topk: 5
    cache: true            # cache/clip/<key>.json
    hf_repo: timm/vit_base_patch32_clip_224.openai   # where open_clip fetches these weights (models.hub_offline)

baselines:
  b0:
    near_dist: 0.5         # [m] same-label obs within this -> unchanged, farther -> moved (§8)

association:               # DESIGN §6.9, B2 (tune on dev only)
  w_g: 1.0                 # weight of the size term (mean |log| ratio of sorted AABB extents)
  w_p: 1.0                 # weight of the position term min(d / pos_scale, 1) (weak)
  pos_scale: 3.0           # [m]
  min_extent: 0.02         # [m] extents are floored at this before the log ratio
  nyu_penalty: 0.3         # oracle: label differs but nyu40 equal -> this cost (else +inf)
  nyu_fallback_exclude: [39, 40]   # catch-all classes (otherfurniture, otherprop): no nyu40 fallback (M5, Erik)
  p_min: 0.05              # perception: label cost = -log max(p(label_ref), p_min)
  tau_assoc:               # pairs with cost >= tau stay unmatched (per observation mode)
    oracle: 2.0
    perception: 3.5
  absorb:                  # stage 0 (M5, Erik): confirmed-in-place nodes claim their observations
    min_frac: 0.5          # share of obs points inside the node AABB + margin
    margin: 0.10           # [m]
  old_place:               # CHANGE 3 Part A (FULL only): a move needs consistent evidence at the old place; values = the
                           # dev_tune sweep row a_u_c02 (Erik 2026-11-20; no row passed the pre-written rule, DECISIONS)
    enabled: true          # false = ablation row FULL-moveev (association ignores votes, as before CHANGE 3)
    inside_frac: 0.5       # "inside its own place": share of obs points inside the node AABB + margin (= absorb)
    margin: 0.10           # [m]
    unobserved_inside_only: true    # a node without counted votes may only match inside its own place too (Erik: a_u_c02)
    max_dist_unseen: null  # [m] or null: a node without counted votes only matches obs within this centroid distance
    tau_move_seen: 0.2     # [m] or null: a net-seen node needs ICP displacement > this (instead of classify.tau_move)

classify:                  # DESIGN §6.10 ICP moved test (tune on dev only)
  tau_move: 0.10           # [m] ICP-refined centroid displacement above this -> moved (§3)
  icp_schedule: [0.20, 0.10, 0.05]   # [m] max correspondence distance per stage
  icp_max_iter: 30
  min_fitness: 0.3         # share of obs points with a correspondence; below -> centroid offset
  fit_tie: 0.02            # two ICP inits (centroid offset, identity): fitness within this -> lower RMSE wins
  max_points: 4000         # random subsample (seeded) of each cloud for speed

confidence:                # DESIGN §6.11 log-odds confidence, FULL only (M6, Erik: rescaled; tune on dev only)
  class_priors: false      # CHANGE 2 Part A (Erik 2026-11-20): no dataset prior; true = l0 = logit(p_persist(label))
                           # from train metadata (M7 FULL, ablation row FULL+classprior with p_del 0.2)
  prior_p: 0.9             # l0 = logit(prior_p) without class priors, flat for every reference node (CHANGE 3, Erik
                           # 2026-11-20; CHANGE 2 had 0.5 / p_del 0.027: same decisions, untouched node reported 0.5)
  prior_kappa: 20          # Beta smoothing of per-class rates toward the parent (nyu40 -> global) rate
  L_hit: 0.63              # per counted seen vote: ln P(seen|unchanged) / P(seen|removed) on dev_tune [0.46, 0.82]
                           # (CHANGE 3 Part C, `lsg chg3 votestats`, DECISIONS 2026-11-20; M6-M7 and CHANGE 2: 2.5)
  L_miss: 1.47             # per counted free vote: ln P(free|removed) / P(free|unchanged) on dev_tune [1.20, 1.86]
  L_free_like: 2.5         # per counted free-like vote: kept (fallback, 7 free-like votes of removed objects < 20)
  clip: 8.0                # per-visit clip of the total log-odds change, [-clip, +clip]
  p_del: 0.2               # removed needs p < p_del (plus the §3 free-evidence rule); margin logit(0.9) - logit(0.2)
                           # = 3.58: 2 net counted free votes delete, 1 cannot, for every class (= M7 FULL-priors)
  candidates:              # CHANGE 2 Part B (docs/CHANGE_confidence_unified.md): per-voxel log-odds of perception candidates
    enabled: true          # false = CHANGE 1 view counts (ablation row FULL-candconf)
    L_vox_hit: 2.5         # per decorrelated voxel hit (CHANGE 3: own key; was confidence.L_hit, the node weight)
    L_vox_free: 2.5        # per decorrelated see-through vote on a voxel (was confidence.L_miss)
    L_corr: 0.25           # correlated (same viewpoint region) hit / see-through vote; decorrelated ones use L_vox_hit / L_vox_free
    corr_cap: 1.0          # sum of correlated additions since the voxel's last decorrelated vote of that kind
    free_votes: true       # see-through votes lower a voxel (false = ablation row FULL-candconf-free)
    free_margin: 0.15      # [m] see-through: minimum depth of the window > z(voxel) + free_margin (= tau_free)
    free_window: 1         # [px] half-size of the minimum-depth window (1 = 3x3); any invalid pixel in it = no info
    l_keep_small: 2.5      # strict tier keeps voxels with lv >= this (2.5 = one decorrelated hit, Erik; 5.0 = CHANGE 1)
    l_keep_large: 2.5      # lenient tier (clusters >= relaxed.large_min_voxels)
    p_new_min: 0.92        # a candidate becomes a `new` node only with sigmoid(median lv) >= this (else dropped, Erik)

appearance:                # DESIGN §3 / §6.6 appearance residual, FULL only (M6)
  enabled: true            # false = depth-only FULL (the brief's ablation)
  features: dinov2         # dinov2 | color (normalised-colour fallback)
  model: vit_small_patch14_dinov2.lvd142m   # timm name, frozen
  device: cuda             # falls back to CPU if CUDA is unavailable
  render_w: 448            # stored-orientation render width [px]; height from the colour aspect (252)
  min_comparable_frac: 0.5 # patch compared if this share of its depth pixels is comparable
  relative: true           # distance minus the frame's median over compared patches (lighting shift, M6)
  min_frame_patches: 20    # fewer compared patches in a frame -> no comparison in that frame
  tau_app:                 # pixel mismatch (thin candidates) if relative 1 - cos > tau_app; per feature type
    dinov2: 0.38           # p98 over compared patches on the dev references' own sequences (lsg m6: 0.384)
    color: 0.85            # same calibration for the colour fallback (0.850)
  tau_node:                # thin-node vote: mean relative distance over the node's comparable pixels
    dinov2: 0.30           # p98 of thing-node means on the dev references' own sequences (lsg m6: 0.297)
    color: 0.54            # (0.537)
  thin_max_extent: 0.15    # [m] thin thing: smallest AABB extent below this (= tau_free; M6, Erik)
  thin_candidates: true    # output (ii): thin-object voxels from mismatches on support surfaces
  support_min_normal_z: 0.8  # support surface: |normal z| of the reference face hit
  cache: true              # cache/appearance/<key>.json (per-frame patch similarities)

models:                    # frozen-model weights (DINOv2, CLIP) from the Hugging Face Hub (M7, Erik)
  hub_offline: auto        # auto: no Hub requests once both repos are cached (HF_HUB_OFFLINE=1); true / false;
                           # an HF_HUB_OFFLINE in the environment wins

update:                    # DESIGN §6.12 graph update
  relations: update        # update (method) | stale (R0) | geometric (R1); saved / scored graph
  keep_supported_parent: true   # update: a re-checked thing keeps its old parent if it still supports it (M5, Erik)
  children_follow_parent: false # FULL (ablation, M7, §6.12): an unknown thing without counted votes whose
                                # support parent is a moved anchor gets the anchor's T_move

m7:                        # `lsg m7` / `lsg ablate` (DESIGN §8, §9): every val row reported once, nothing tuned
  val_split: splits/eval_val.txt              # final tables: all 110 pairs (CLAUDE.md)
  relchange_split: splits/eval_relchange_train.txt
  dev_rows: [B0, B1, B2, FULL, FULL-contrast]
  regression_refs:                            # dev runs whose metrics must be unchanged (thin keys excluded)
    B0: outputs/m5_final2/dev_B0
    B1: outputs/m5_final2/dev_B1
    B2: outputs/m6_final/dev_B2
    FULL-contrast: outputs/m6_final/dev_FULL  # M6 FULL = FULL without seen-needs-contrast
  tau_free_sweep: [0.05, 0.10, 0.20, 0.30]    # [m] the default 0.15 is the FULL row
  fracs: [0.5, 0.25, 0.1]                     # §7.3 observed fraction (100% = the FULL row)
  frac_seeds: [0, 1, 2]
  p_new_sweep: [0.95, 0.99, 0.999]            # `lsg newcurve`: new P / R at these p_new_min (plus the default)
  relchange_rows: [B2, FULL, FULL+follow, FULL-keepparent]
  determinism_pair: 0                         # index into splits/dev_train.txt

m1:
  count_split: splits/eval_val.txt
  expected_counts: {rigid: 390, removed: 96, new_raw: 224}   # DESIGN §2.2
  hist_splits: [splits/eval_val.txt, splits/dev_train.txt]
  meta_only_splits: [splits/eval_relchange_train.txt]        # tier 2 meshes not downloaded
  rule_tune_split: splits/dev_train.txt                      # reference-rule sanity, tuning
  rule_report_split: splits/eval_val.txt                     # reference-rule sanity, report only
  expected_texture_refs: 72

chg3:                      # CHANGE 3 dev_tune sweeps (`lsg chg3 parta`; docs/CHANGE_online_graph.md; tuning set only)
  part_a:                  # §3: a move needs consistent old-place evidence; variants listed simple -> complex
    variants:
      "off": {association.old_place.enabled: false}
      a: {association.old_place.enabled: true, association.old_place.unobserved_inside_only: false,
          association.old_place.max_dist_unseen: null, association.old_place.tau_move_seen: null}
      a_u: {association.old_place.enabled: true, association.old_place.unobserved_inside_only: true,
            association.old_place.max_dist_unseen: null, association.old_place.tau_move_seen: null}
      a_d1: {association.old_place.enabled: true, association.old_place.unobserved_inside_only: false,
             association.old_place.max_dist_unseen: 1.0, association.old_place.tau_move_seen: null}
      a_c03: {association.old_place.enabled: true, association.old_place.unobserved_inside_only: false,
              association.old_place.max_dist_unseen: null, association.old_place.tau_move_seen: 0.3}
      a_u_c02: {association.old_place.enabled: true, association.old_place.unobserved_inside_only: true,
                association.old_place.max_dist_unseen: null, association.old_place.tau_move_seen: 0.2}
      a_u_c03: {association.old_place.enabled: true, association.old_place.unobserved_inside_only: true,
                association.old_place.max_dist_unseen: null, association.old_place.tau_move_seen: 0.3}
    criterion:             # written before the sweep (DECISIONS 2026-11-20): pass in both modes
      false_move_frac: 0.5 # false-move rate <= 0.5 x the `off` row's
      f1_drop: 0.02        # moved F1 >= the `off` row's - 0.02; winner = highest mean moved F1 of passing rows
  part_c:                  # §5: confidence policy from sensor statistics (lsg chg3 votestats; DECISIONS 2026-11-20)
    votestats:             # vote weights as likelihood ratios (eval/votestats.py), written before the run
      min_votes: 20        # a vote kind with fewer counted votes in either class keeps `fallback`
      fallback: 2.5
      n_boot: 1000
      seed: 0
