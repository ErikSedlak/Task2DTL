# Thresholds live here, not in code (CLAUDE.md hard rule 3). Values marked (tune) in DESIGN.md
# are starting points and may only be tuned on splits/dev_train.txt.
data_root: ./data          # overridden by env LSG_DATA
outputs_root: ./outputs
cache_root: ./cache        # refined alignments etc. (git-ignored)

frames:
  stride: 3                # DESIGN §3 (tune)

alignment:                 # T_align refinement, label-free ICP (DECISIONS 2026-11-05/M0)
  refine: true
  frame_step: 10           # every 10th frame builds the source cloud
  voxel: 0.02              # [m] source voxel downsampling
  max_depth: 4.0           # [m] ignore far, noisy depth
  icp_schedule: [0.10, 0.05, 0.03]   # [m] max correspondence distance per stage (= Tukey k)
  max_iter: 50
  max_delta_t: 0.20        # [m] reject corrections larger than this, keep raw T_align
  max_delta_rot_deg: 5.0

visibility:                # DESIGN §3 frame votes (tune on dev only)
  tau_near: 0.10           # [m] |d_obs - d_exp| <= tau_near -> present
  tau_free: 0.15           # [m] d_obs > d_exp + tau_free -> free (seen through)
  min_mask_px: 15          # node needs >= this many first-hit pixels (else unobserved) and
                           # >= this many valid ones (else noinfo) to vote (DECISIONS M3)
  vote_frac: 0.5           # share of valid pixels for a seen / free vote
  erode_px: 0              # erode each node's first-hit mask by this many px (silhouette guard; M3 knob)

decorrelation:             # DESIGN §3 viewpoint decorrelation (tune)
  enabled: true            # false = every vote counts (ablation, §8)
  d_dec: 0.30              # [m] camera centre moved this far since the last counted vote ...
  theta_dec_deg: 20.0      # [deg] ... or the optical axis turned this much

states:                    # DESIGN §3 state rules (tune)
  k_free: 2                # counted free votes needed for removed
  k_seen: 3                # counted seen votes (and no counted free) -> confirmed in place

online:                    # DESIGN §6.7 online loop
  snapshot_every: 20       # write a tentative snapshot every N processed frames (if enabled)

m0:
  pairs_file: splits/dev_train.txt
  depth_frame_step: 10     # check (1): every 10th frame of each dev rescan
  overlay_scans:           # check (4): rescans used for overlay PNGs
    - 0ad2d3a1-79e2-2212-9b99-a96495d9f7fe
    - 19eda6f4-55aa-29a0-8893-8eac3a4d8193
  overlay_frames: 3
  accept_depth_median: 0.03      # (1) median |d_obs - d_render| [m]
  accept_struct_median: 0.05     # (2) median structure point-to-surface distance [m]
  accept_rigid_chamfer: 0.05     # (3) Chamfer [m]
  accept_rigid_min_objects: 2    # (3) objects below the Chamfer threshold

splits:
  texture_sources:         # pair lists whose references need textures (DESIGN §2.3)
    - splits/dev_train.txt
    - splits/eval_val.txt
    - splits/eval_relchange_train.txt
  texture_list: splits/download_textures.txt

relations:                 # geometric support rules, DESIGN §6.3 (tune on dev refs only)
  bottom_slice: 0.03       # [m] child's lowest slice used for contact
  contact_xy: 0.05         # [m] horizontal radius for a supporting point
  contact_dz: 0.10         # [m] supporting point lies 0..contact_dz below the slice point
  contact_min_frac: 0.30   # share of slice points with support -> "on"
  contain_min_frac: 0.60   # share of child points inside an anchor's AABB -> "in"
  floor_max_gap: 0.20      # [m] child bottom this close above floor_z -> parent "floor" (dev-tuned M1; spec start 0.10)
  support_min_height: 0.05 # [m] supporting points must lie this far above floor_z (dev-tuned M1)
  candidate_margin: 0.10   # [m] XY AABB margin for the candidate pre-filter
  next_to_gap: 0.15        # [m] AABB gap for geometric next_to (exported only)
  floor_fallback_percentile: 1.0   # floor_z if no floor-labelled vertices: this percentile of z

eval:                      # evaluation protocol (DESIGN §5, §7) - definitions, not method tunables
  tau_eval_move: 0.10      # [m] GT moves below this are dont_care for moved/unchanged (fixed M1)
  small_max_extent: 0.5    # [m] thing with largest AABB extent below this = "small"
  disp_buckets: [0.1, 0.3, 1.0]    # [m] moved-recall buckets [0.1,0.3), [0.3,1), >=1
  match_new_dist: 0.30     # [m] perception new matching: centroid distance gate (§5)
  match_new_iou: 0.25      # perception new matching: 3D AABB IoU gate (§5)
  bootstrap_n: 1000        # resamples over pairs for 95% CIs (§7.1)
  bootstrap_seed: 0
  workers: 4               # processes for `lsg eval` (one reference group per task)
  save_graphs: true        # write G_upd per pair to outputs/<run>/graphs/

oracle:                    # OracleSource, DESIGN §6.5 (upper bound)
  min_points: 50           # drop instances with fewer observed mesh vertices (tune)
  seed: 0                  # token permutation seed (mixed with the rescan id)
  crops: false             # colour crops (not used by the change logic before M4/M6)
  crop_k: 5

baselines:
  b0:
    near_dist: 0.5         # [m] same-label obs within this -> unchanged, farther -> moved (§8)

m1:
  count_split: splits/eval_val.txt
  expected_counts: {rigid: 390, removed: 96, new_raw: 224}   # DESIGN §2.2
  hist_splits: [splits/eval_val.txt, splits/dev_train.txt]
  meta_only_splits: [splits/eval_relchange_train.txt]        # tier 2 meshes not downloaded
  rule_tune_split: splits/dev_train.txt                      # reference-rule sanity, tuning
  rule_report_split: splits/eval_val.txt                     # reference-rule sanity, report only
  expected_texture_refs: 72
