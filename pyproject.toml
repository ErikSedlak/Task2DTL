[project]
name = "lsg"
version = "0.1.0"
description = "Living Scene Graphs, Subproject D: change detection and graph maintenance on 3RScan"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "open3d>=0.18",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "torch>=2.5,<2.6",
    "torchvision>=0.20,<0.21",
    "open_clip_torch>=2.26",
    "timm>=1.0",
    "rerun-sdk>=0.20",
    "segment-anything>=1.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[project.scripts]
lsg = "lsg.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs local 3RScan data or takes > 1 s (deselect with -m 'not slow')"]
addopts = "-m 'not slow' -p no:dash"

[tool.uv]
# pyarrow (pulled in by rerun-sdk) >= 22 needs NumPy 2; this project pins NumPy < 2 (DECISIONS M8)
constraint-dependencies = ["pyarrow<22"]
