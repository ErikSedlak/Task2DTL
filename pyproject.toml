[project]
name = "lsg"
version = "0.1.0"
description = "Living Scene Graphs, Subproject D: change detection and graph maintenance on 3RScan"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "open3d>=0.18",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
lsg = "lsg.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs local 3RScan data or takes > 1 s (deselect with -m 'not slow')"]
addopts = "-m 'not slow' -p no:dash"
